email: "dhriti@research.org"  # Required by NCBI for Entrez access
ncbi_api_key: null  # Optional: increases rate limit from 3 to 10 req/s

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  output_dir: "data/output"

search:
  max_results: 100
  organism: "Homo sapiens"

rate_limit:
  entrez_delay: 0.34  # seconds between NCBI requests (3 req/s without API key)
  geo_delay: 1.0      # seconds between GEO downloads
  max_retries: 3
  retry_backoff: 2.0

output:
  format: "parquet"  # "csv" or "parquet"

drg:
  # Minimum number of human DRG studies required (warn if fewer found)
  min_human_studies: 3
  # Minimum cells/samples per group to pass QC (null = no hard threshold)
  min_cells_per_group: null
  # Whether to require human-only studies
  require_human: true
  # Whether to require injured vs healthy labels
  require_labels: true
  # Canonical DRG search queries (all three are run and results deduplicated)
  search_queries:
    - "human dorsal root ganglion single nucleus"
    - "DRG scRNA-seq neuropathic pain"
    - "injured vs control DRG"
